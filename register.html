<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Sesoma</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="register">
  <header id="site-header"></header>
  <main>
    <section class="form-box">
      <h2>Create your account</h2>
      <p class="sub">It takes less than a minute.</p>
      <form id="register-form" novalidate>
        <label for="name">Full name</label>
        <input type="text" id="name" autocomplete="name" required>
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="new-password" required>
        <label for="confirm">Confirm password</label>
        <input type="password" id="confirm" autocomplete="new-password" required>
        <button class="btn" type="submit">Create account</button>
        <div id="msg" class="msg" role="alert"></div>
      </form>
      <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="script.js"></script>
</body>
</html>
